<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="/loadMenuContent.js" defer></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
    }

    header {
      background-color: #1c1c1c;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .stock-info {
      flex-shrink: 0;
      margin-right: 2rem;
    }

    .ticker-wrap {
      position: relative;
      overflow: hidden;
      flex: 1;
    }

    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: ticker 40s linear infinite;
    }

    @keyframes ticker {
      0% {
        transform: translateX(0%);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .ticker-item {
      display: inline-block;
      padding-right: 2rem;
      color: #90caf9;
    }

    .pos {
      color: #66bb6a;
    }

    .neg {
      color: #ef5350;
    }

    .bar {
      background-color: #1e1e1e;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      text-align: center;
      color: #90caf9;
    }

    main {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      height: calc(100vh - 5rem);
      gap: 0.75rem;
      padding: 0.75rem;
    }

    section {
      background-color: #1e1e1e;
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
    }

    /* Fundamental Analysis: 2 columns inside */
    section[data-section="fundamental"] .data-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      flex: 1;
      overflow: auto;
    }

    /* Column placement based on data-section attribute */
    section[data-section="fundamental"] {
      grid-column: 1;
    }

    section[data-section="esg"] {
      grid-column: 2;
    }

    /* Wrapper for Public + Technical Sentiment in column 3 */
    .col3-wrapper {
      display: flex;
      flex-direction: column;
      grid-column: 3;
      height: 100%;
      gap: 0.75rem;
    }

    /* Each sentiment section takes half height inside wrapper */
    .col3-wrapper>section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    section h2 {
      font-size: 0.9rem;
      color: #90caf9;
      margin: 0;
    }

    .confidence {
      font-weight: bold;
    }

    .confidence.green {
      color: #66bb6a;
    }

    .confidence.red {
      color: #ef5350;
    }

    table {
      width: 100%;
      font-size: 0.75rem;
      color: #ddd;
    }

    .right {
      text-align: right;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        height: auto;
      }

      .col3-wrapper {
        grid-column: auto;
        flex-direction: row;
        height: auto;
      }

      .col3-wrapper>section {
        flex: 1;
      }

      section[data-section="fundamental"] .data-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="stock-info">
      <strong id="stockName">[SECURITY SYMBOL]</strong> | Close: <span id="closePrice">[PRICE]</span> | Exchange: <span
        id="exchangeName">[EXCHANGE]</span>
    </div>
    <div class="ticker-wrap">
      <div class="ticker-content" id="ticker-content"></div>
    </div>
  </header>

  <div class="bar">75% Long Term | 60% Short Term</div>

  <main>
    <section data-section="fundamental">
      <div class="section-header">
        <h2>Fundamental Analysis</h2>
        <span class="confidence"></span>
      </div>
      <div class="data-container">
        <!-- Example: left and right columns content -->
        <div>Left column content</div>
        <div>Right column content</div>
      </div>
    </section>
    <section data-section="technical-sentiment">
      <div class="section-header">
        <h2>Technical Sentiment</h2>
        <span class="confidence"></span>
      </div>
    </section>

    <div class="col3-wrapper">
      <section data-section="public-sentiment">
        <div class="section-header">
          <h2>Public Sentiment</h2>
          <span class="confidence"></span>
        </div>
      </section>
      <section data-section="esg">
        <div class="section-header">
          <h2>ESG Analysis</h2>
          <span class="confidence"></span>
        </div>
      </section>
    </div>
  </main>

  <script>
    const indices = [
      { n: "S&P 500", p: 4300, c: "+10", cp: "+0.23%" },
      { n: "Dow", p: 34567, c: "+123", cp: "+0.4%" },
      { n: "Nasdaq", p: 14000, c: "-50", cp: "-0.35%" }
    ];

    const tickerContent = document.getElementById('ticker-content');
    let tickerHTML = '';

    indices.forEach(i => {
      tickerHTML += `<span class="ticker-item">${i.n}: ${i.p} <span class="${i.c.startsWith('+') ? 'pos' : 'neg'}">${i.c} (${i.cp})</span></span>`;
    });
    tickerContent.innerHTML = tickerHTML + tickerHTML; // repeat for seamless scroll

    // Fill confidence scores
    document.querySelectorAll('section').forEach(sec => {
      const span = sec.querySelector('.confidence');

      //fundamental
      const fundamentalData = JSON.parse(localStorage.getItem('_data_FundamentalAnalysis'));
      const fundamentalConfidence = fundamentalData.summary.toFixed(0) ?? 0;  // Get 65 or fallback to 0

      //public sentiment
      function combinedConfidence(cnn, publicSentiment) {
        return 0.6 * cnn + 0.4 * publicSentiment;
      }
      function sentimentToConfidence(S) {
        const m = 0.2;   // 20%
        const p = 1.0;   // 100%
        const c = 75;    // peak at 75
        const a = 0.00123;
        return (m + (p - m) * Math.exp(-a * Math.pow(S - c, 2))) * 100;
      }
      const rawFearGreed = localStorage.getItem('_data_FearGreedData');
      const fearGreedData = JSON.parse(rawFearGreed);
      const rawPublicSentiment = localStorage.getItem('_data_PublicSentimentIndex');
      var percentageScorePublicSentiment = sentimentToConfidence(rawPublicSentiment);
      const publicSentimentConfidence = combinedConfidence(fearGreedData.percentageScore.toFixed(0), percentageScorePublicSentiment).toFixed(0);


      var confMap = {
        "fundamental": fundamentalConfidence,
        "esg": 10,
        "public-sentiment": publicSentimentConfidence,
        "technical-sentiment": 10
      };
      var score = confMap[sec.dataset.section] || 50;
      span.textContent = `${score}% Confidence`;
      span.classList.add(score >= 50 ? 'green' : 'red');
    });
  </script>

</body>

</html>
